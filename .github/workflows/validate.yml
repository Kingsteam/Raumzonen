name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: eigenes Logo im home-assistant/brands-Repo fehlt noch.
          # description/topics: auf GitHub noch nicht gesetzt. Vor einer
          # Aufnahme in den HACS-Standardkatalog nachholen und entfernen.
          ignore: brands description topics
